version: "3.9"

services:
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    ports:
      - "5000:5000"
    env_file:
      - apps/server/.env
    depends_on:
      - mongo
    environment:
      - NODE_ENV=development
      # Override the MongoDB URI to use the authenticated local instance
      - MONGODB_URI=mongodb://root:devpassword@mongo:27017/wordle-clone?authSource=admin

  mongo:
    image: mongo:7
    # Bind to localhost only — not exposed to the entire network
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: devpassword
      MONGO_INITDB_DATABASE: wordle-clone
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
